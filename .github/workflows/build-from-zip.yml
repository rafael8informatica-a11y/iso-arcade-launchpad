name: Gerar APK do ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório com histórico
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extrair o ZIP mais recente
        run: |
          shopt -s dotglob
          # Busca o arquivo .zip modificado/enviado mais recentemente no Git
          LATEST_ZIP=$(git log -n 1 --pretty=format: --name-only -- "*.zip" | head -n 1)
          
          # Se o último commit não foi um .zip (ex: editou o .yml), pega o último .zip da história
          if [ -z "$LATEST_ZIP" ] || [ ! -f "$LATEST_ZIP" ]; then
            LATEST_ZIP=$(git log --pretty=format: --name-only -- "*.zip" | grep -v '^$' | while read f; do [ -f "$f" ] && echo "$f" && break; done)
          fi

          echo "Compilando a partir do ZIP mais recente: $LATEST_ZIP"
          if [ -z "$LATEST_ZIP" ]; then
            echo "ERRO: Nenhum arquivo .zip encontrado."
            exit 1
          fi

          mkdir -p temp_extract
          unzip -oq "$LATEST_ZIP" -d temp_extract
          
          if [ -d "temp_extract/iso-arcade-launchpad-main" ]; then
            cp -rf temp_extract/iso-arcade-launchpad-main/* .
          else
            cp -rf temp_extract/* .
          fi
          rm -rf temp_extract

      - name: Configurar Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependências
        run: bun install

      - name: Baixar núcleo nativo (ARMSX2)
        run: |
          if [ -f "scripts/fetch-armsx2-core.sh" ]; then
            chmod +x scripts/fetch-armsx2-core.sh
            ./scripts/fetch-armsx2-core.sh
          fi

      - name: Limpar build anterior e compilar Web
        run: |
          rm -rf dist android/app/src/main/assets/public
          bun run build
          bunx cap sync android

      - name: Gerar APK limpo
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug

      - name: Salvar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: app-emulador-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
