name: Gerar APK do ZIP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Extrair iso-arcade-launchpad-controles.zip
        run: |
          shopt -s dotglob
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          echo "Extraindo: $ZIP_FILE"
          
          if [ -z "$ZIP_FILE" ]; then
            echo "ERRO: Nenhum .zip encontrado."
            exit 1
          fi

          # Limpa pastas antigas do repositório antes de extrair o novo ZIP
          rm -rf src android public scripts package.json bun.lock vite.config.ts

          mkdir -p temp_extract
          unzip -oq "$ZIP_FILE" -d temp_extract

          # Descobre automaticamente se o ZIP tem uma pasta raiz interna (ex: iso-arcade-launchpad-controles/)
          SUBDIR=$(find temp_extract -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [ -n "$SUBDIR" ] && [ -f "$SUBDIR/package.json" ]; then
            echo "Movendo arquivos de $SUBDIR"
            cp -rf "$SUBDIR"/* .
          else
            echo "Movendo arquivos da raiz do ZIP"
            cp -rf temp_extract/* .
          fi
          rm -rf temp_extract

      - name: Configurar Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependências
        run: bun install

      - name: Baixar núcleo nativo (ARMSX2)
        run: |
          if [ -f "scripts/fetch-armsx2-core.sh" ]; then
            chmod +x scripts/fetch-armsx2-core.sh
            ./scripts/fetch-armsx2-core.sh
          fi

      - name: Compilar Web e sincronizar Android
        run: |
          bun run build
          bunx cap sync android

      - name: Gerar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Salvar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: nebula2-controles-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
