name: Build e APK Unificado (NEBULA 2)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar repositório completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: 2. Extrair ZIP mais recente usando Python
        run: |
          python3 -c '
          import glob, os, zipfile, shutil, subprocess

          out = subprocess.check_output(["git", "log", "--pretty=format:", "--name-only", "--", "*.zip"]).decode().splitlines()
          zips = [f.strip() for f in out if f.strip() and os.path.isfile(f.strip())]
          if not zips:
              zips = sorted(glob.glob("*.zip"), key=os.path.getmtime, reverse=True)

          if not zips:
              raise SystemExit("ERRO: Nenhum arquivo .zip encontrado no repositório.")

          target_zip = next(iter(zips))
          print(f">>> ZIP selecionado: {target_zip} ({os.path.getsize(target_zip)} bytes)")

          if os.path.exists("build_workspace"):
              shutil.rmtree("build_workspace")
          if os.path.exists("app_src"):
              shutil.rmtree("app_src")

          with zipfile.ZipFile(target_zip, "r") as zf:
              zf.extractall("build_workspace")

          pkg_dir = None
          for root, dirs, files in os.walk("build_workspace"):
              if "package.json" in files:
                  pkg_dir = root
                  break

          if not pkg_dir:
              raise SystemExit("ERRO: package.json não encontrado dentro do ZIP.")

          print(f">>> Projeto localizado em: {pkg_dir}")
          shutil.move(pkg_dir, "app_src")
          shutil.rmtree("build_workspace", ignore_errors=True)
          '

      - name: 3. Configurar Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 5. Instalar dependências do projeto
        working-directory: app_src
        run: |
          rm -f bun.lock bun.lockb package-lock.json
          bun install || npm install --legacy-peer-deps

      - name: 6. Baixar núcleo nativo (ARMSX2)
        working-directory: app_src
        run: |
          if [ -f "scripts/fetch-armsx2-core.sh" ]; then
            chmod +x scripts/fetch-armsx2-core.sh
            ./scripts/fetch-armsx2-core.sh
          fi

      - name: 7. Compilar Web e sincronizar Android
        working-directory: app_src
        run: |
          bun run build || npx vite build
          mkdir -p dist
          bunx cap copy android || npx cap copy android

      - name: 8. Gerar APK limpo (Debug)
        working-directory: app_src/android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug

      - name: 9. Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: nebula2-apk-atualizado
          path: app_src/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
