# Gera o APK do NEBULA·2 no GitHub, sem Android Studio.
# Roda a cada push na branch principal e também pelo botão Run workflow na aba Actions.
# O APK fica em: aba Actions → execução mais recente → Artifacts → nebula2-apk.

name: Gerar APK Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache de dependências do Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Exportar a interface como arquivos locais
        run: CAPACITOR_BUILD=1 bunx vite build

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache do Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Copiar a interface para o projeto Android
        run: bunx cap sync android

      - name: Compilar o APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Enviar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: nebula2-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
