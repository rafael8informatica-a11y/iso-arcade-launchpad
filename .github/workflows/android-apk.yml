name: Build e APK Unificado (NEBULA 2)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar repositório completo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 2. Extrair ZIP mais recente com segurança
        run: |
          set -e
          LATEST_ZIP=$(git log -n 1 --pretty=format: --name-only -- "*.zip" | head -n 1)
          if [ -z "$LATEST_ZIP" ] || [ ! -f "$LATEST_ZIP" ]; then
            LATEST_ZIP=$(git log --pretty=format: --name-only -- "*.zip" | grep -v '^$' | while read -r f; do [ -f "$f" ] && echo "$f" && break; done)
          fi
          if [ -z "$LATEST_ZIP" ]; then
            LATEST_ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          fi

          if [ -z "$LATEST_ZIP" ]; then
            echo "ERRO: Nenhum arquivo .zip encontrado."
            exit 1
          fi

          echo ">>> Arquivo ZIP selecionado: $LATEST_ZIP"
          ls -lh "$LATEST_ZIP"

          # Extrai o ZIP em uma pasta isolada para não tocar em .git ou .github
          rm -rf build_workspace
          mkdir -p build_workspace
          unzip -oq "$LATEST_ZIP" -d build_workspace

          # Descobre se o conteúdo está na raiz de build_workspace ou dentro de uma subpasta
          if [ -f "build_workspace/package.json" ]; then
            echo ">>> Projeto encontrado na raiz do ZIP"
            mv build_workspace app_src
          else
            SUBDIR=$(find build_workspace -mindepth 1 -maxdepth 2 -name "package.json" -exec dirname {} \; | head -n 1)
            if [ -n "$SUBDIR" ]; then
              echo ">>> Projeto encontrado na subpasta: $SUBDIR"
              mv "$SUBDIR" app_src
            else
              echo "ERRO: package.json não encontrado dentro do ZIP!"
              find build_workspace -maxdepth 3
              exit 1
            fi
          fi

      - name: 3. Configurar Java (JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 5. Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 6. Instalar dependências do projeto
        working-directory: app_src
        run: bun install

      - name: 7. Baixar núcleo nativo (ARMSX2)
        working-directory: app_src
        run: |
          if [ -f "scripts/fetch-armsx2-core.sh" ]; then
            chmod +x scripts/fetch-armsx2-core.sh
            ./scripts/fetch-armsx2-core.sh
          fi

      - name: 8. Compilar Web e sincronizar Android
        working-directory: app_src
        run: |
          bun run build
          bunx cap sync android

      - name: 9. Gerar APK limpo (Debug)
        working-directory: app_src/android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug

      - name: 10. Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: nebula2-apk-atualizado
          path: app_src/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
