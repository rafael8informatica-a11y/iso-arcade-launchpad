name: Gerar APK Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache de dependências do Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Instalar dependências
        run: bun install

      - name: Exportar a interface como arquivos locais
        run: |
          CAPACITOR_BUILD=1 bun run build
          mkdir -p dist/client
          if [ -d ".output/public" ] && [ ! -d "dist/client/assets" ]; then
            cp -r .output/public/* dist/client/
          fi
          if [ ! -f "dist/client/index.html" ]; then
            CSS_TAG=""
            JS_TAG=""
            for f in dist/client/assets/*.css; do
              [ -e "$f" ] && CSS_TAG="$CSS_TAG<link rel=\"stylesheet\" href=\"./assets/$(basename "$f")\">"
            done
            for f in dist/client/assets/*.js; do
              [ -e "$f" ] && JS_TAG="$JS_TAG<script type=\"module\" src=\"./assets/$(basename "$f")\"></script>"
            done
            cat <<EOF > dist/client/index.html
          <!doctype html>
          <html lang="pt-BR">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
              <title>NEBULA·2</title>
              $CSS_TAG
            </head>
            <body>
              <div id="root"></div>
              $JS_TAG
            </body>
          </html>
          EOF
          fi
          if [ ! -f "dist/index.html" ]; then
            cp -r dist/client/* dist/
          fi

      - name: Baixar núcleo nativo do Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          mkdir -p android/app/src/main/assets/resources
          mkdir -p temp_core
          gh release download nucleo-v1 -p "*.zip" -D temp_core
          unzip -q temp_core/*.zip -d temp_core/extracted
          find temp_core/extracted -name "*.so" -exec cp {} android/app/src/main/jniLibs/arm64-v8a/ \;
          if [ -d "temp_core/extracted/resources" ]; then
            cp -r temp_core/extracted/resources/* android/app/src/main/assets/resources/
          fi
          ls -lh android/app/src/main/jniLibs/arm64-v8a/
          rm -rf temp_core

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache do Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Copiar a interface para o projeto Android
        run: |
          if [ ! -d "android" ]; then
            bunx cap add android
          fi
          bunx cap sync android

      - name: Compilar o APK
        working-directory: android
        run: |
          sed -i 's/s\.getBool("vibration", true)/(s.getBool("vibration") != null ? s.getBool("vibration") : true)/g' app/src/main/java/com/nebula2/emulador/Ps2CorePlugin.java
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Enviar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: nebula2-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
