name: Build e APK Unificado (NEBULA 2)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar repositório completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Limpar arquivos antigos e extrair ZIP mais recente
        run: |
          shopt -s dotglob
          
          # Encontra o .zip enviado mais recentemente no histórico do Git
          LATEST_ZIP=$(git log -n 1 --pretty=format: --name-only -- "*.zip" | head -n 1)
          if [ -z "$LATEST_ZIP" ] || [ ! -f "$LATEST_ZIP" ]; then
            LATEST_ZIP=$(git log --pretty=format: --name-only -- "*.zip" | grep -v '^$' | while read f; do [ -f "$f" ] && echo "$f" && break; done)
          fi
          
          # Fallback caso exista algum .zip solto na raiz
          if [ -z "$LATEST_ZIP" ]; then
            LATEST_ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          fi

          if [ -z "$LATEST_ZIP" ]; then
            echo "ERRO CRÍTICO: Nenhum arquivo .zip encontrado na raiz do repositório."
            exit 1
          fi

          echo ">>> Usando o arquivo ZIP: $LATEST_ZIP"

          # Apaga todas as pastas e arquivos antigos do repositório para evitar mistura de versões
          rm -rf src android public scripts dist node_modules package.json bun.lock vite.config.ts tsconfig.json capacitor.config.ts

          # Extrai o novo ZIP em pasta temporária
          mkdir -p temp_extract
          unzip -oq "$LATEST_ZIP" -d temp_extract

          # Detecta automaticamente se há uma subpasta interna (ex: iso-arcade-launchpad-controles/)
          SUBDIR=$(find temp_extract -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [ -n "$SUBDIR" ] && [ -f "$SUBDIR/package.json" ]; then
            echo ">>> Extraindo conteúdo da subpasta: $SUBDIR"
            cp -rf "$SUBDIR"/* .
          else
            echo ">>> Extraindo conteúdo da raiz do ZIP"
            cp -rf temp_extract/* .
          fi
          
          rm -rf temp_extract

      - name: 3. Configurar Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 5. Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 6. Instalar dependências do projeto
        run: bun install

      - name: 7. Baixar núcleo nativo (ARMSX2)
        run: |
          if [ -f "scripts/fetch-armsx2-core.sh" ]; then
            chmod +x scripts/fetch-armsx2-core.sh
            ./scripts/fetch-armsx2-core.sh
          else
            echo "Aviso: scripts/fetch-armsx2-core.sh não encontrado, pulando etapa."
          fi

      - name: 8. Verificar código e compilar aplicação Web
        run: |
          bun run build
          bunx cap sync android

      - name: 9. Gerar APK limpo (Debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug

      - name: 10. Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: nebula2-apk-atualizado
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
