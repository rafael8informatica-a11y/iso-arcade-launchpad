name: Aplicar atualização
on:
  push:
    paths:
      - so-arquivos-alterados.zip
  workflow_dispatch:
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair o zip por cima do projeto
        run: |
          unzip -o so-arquivos-alterados.zip -d .
          rm so-arquivos-alterados.zip
      - name: Salvar no repositório
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Aplicar atualização (controles, saves e shaders)"
          git push
